name: Build and Test

# Пока что только под linux, возможно, успею сделать сборку под windows.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

  workflow-dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build
        run: docker compose run --rm build-linux

  test:
    needs: build
    runs-on: ubuntu-24.04
    name: Test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Test
        run: docker compose run --rm test-linux